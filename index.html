<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#f8f8f5" />
    <meta
      name="description"
      content="me/day — 사진 하나로 쌓이는 나의 식사와 하루"
    />
    <title>me/day — 나의 하루</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          me<span class="brand-slash">/</span>day <span class="tiny-dot"></span>
        </div>
        <button
          type="button"
          id="pointsButton"
          class="points-button"
          aria-label="내 포인트"
        >
          내 포인트
        </button>
        <button
          class="icon-btn"
          id="settingsButton"
          aria-label="설정"
          title="설정"
        >
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.8"
          >
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.7 1.7 0 0 0 .34 1.9l-1.6 1.6a1.7 1.7 0 0 0-1.9-.35 1.7 1.7 0 0 0-1.1 1.65v.2h-2.3v-.2a1.7 1.7 0 0 0-1.1-1.65 1.7 1.7 0 0 0-1.9.35l-1.6-1.6A1.7 1.7 0 0 0 8.6 15a1.7 1.7 0 0 0-1.65-1.1h-.2v-2.3h.2A1.7 1.7 0 0 0 8.6 10.5a1.7 1.7 0 0 0-.35-1.9L9.85 7a1.7 1.7 0 0 0 1.9.35 1.7 1.7 0 0 0 1.1-1.65v-.2h2.3v.2a1.7 1.7 0 0 0 1.1 1.65 1.7 1.7 0 0 0 1.9-.35l1.6 1.6a1.7 1.7 0 0 0-.35 1.9 1.7 1.7 0 0 0 1.65 1.1h.2v2.3h-.2A1.7 1.7 0 0 0 19.4 15z"
              transform="translate(-2 -1)"
            />
          </svg>
        </button>
      </header>
      <nav class="mode-switch" id="modeSwitch" aria-label="기간 선택">
        <button data-view="day" class="selected">일간</button
        ><button data-view="week">주간</button
        ><button data-view="month">월간</button>
      </nav>
      <main id="main" aria-live="polite"></main>
      <nav class="bottom-nav">
        <button id="homeBtn" class="bottom-link active" aria-label="기록 홈">
          <span class="nav-icon">⌂</span><span>하루</span></button
        ><button id="recommendBtn" class="bottom-link" aria-label="메뉴 추천">
          <span class="nav-icon">✧</span><span>뭐 먹지?</span></button
        ><button id="addBtn" class="fab" aria-label="기록 추가">＋</button
        ><button id="statsBtn" class="bottom-link" aria-label="주간 통계">
          <span class="nav-icon">▥</span><span>통계</span></button
        ><button id="calendarBtn" class="bottom-link" aria-label="달력">
          <span class="nav-icon">▦</span><span>달력</span>
        </button>
      </nav>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="overlay" class="overlay hidden" role="presentation">
      <div class="sheet" id="sheet" role="dialog" aria-modal="true">
        <div class="sheet-handle"></div>
        <div id="sheetContent"></div>
      </div>
    </div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
